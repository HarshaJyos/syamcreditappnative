apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-android" // Added for core-ktx and Firebase

android {
    compileSdkVersion 35 // Matches installed SDK and androidx.core requirements
    namespace "com.syam.creditcard" // Consistent with Firebase
    defaultConfig {
        compileSdk 35
        applicationId "com.syam.creditcard"
        minSdk 21
        targetSdk 34 // Avoid Android 15 behavior changes
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug // Use debug signing for simplicity
            minifyEnabled true // Replaced enableProguardInReleaseBuilds
            shrinkResources true // Optional: reduce resource size
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    // Disable RenderScript to address deprecation warning
    renderscript {
        supportModeEnabled false
        supportMode false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-android:0.74.5" // Match RN version
    implementation "androidx.core:core:1.16.0" // Required by error
    implementation "androidx.core:core-ktx:1.16.0" // Required by error
    implementation platform('com.google.firebase:firebase-bom:33.5.1') // Consistent Firebase versions
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion" // For core-ktx
    // Add for vector-icons if not auto-linked
    implementation project(':react-native-vector-icons')
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle" // For vector-icons

react {
    entryFile = "index.js"
    root = file("../..")
}