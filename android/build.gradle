buildscript {
    ext {
        buildToolsVersion = "35.0.0" // Matches installed SDK
        minSdkVersion = 21
        compileSdkVersion = 35
        targetSdkVersion = 34
        kotlinVersion = "1.9.24" // Compatible with RN and core-ktx
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.1") // Latest stable AGP
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin:0.74.5") // Match RN
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } // For RN libraries
    }
}